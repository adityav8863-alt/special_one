<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Form</title>

      <br />
      <div>
        Text area: <textarea name="Text area" rows="4" cols="50"></textarea>
      </div>
      Gender: Male <input type="radio" name="Gender" /> Female
      <input type="radio" name="Gender" /> other
      <input type="radio" name="Gender" />

      <br />
      <div>
        <br>
        <details>this is a paragraph </details>
