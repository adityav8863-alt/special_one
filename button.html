<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buttons</title>
    <style>
        .container{
            padding: 20px;
            margin: 20px;
            border: 1px solid #199b70;
            background-color: #c98f8f;
            border-radius: 10px;

        }
        .btn{
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #199b70;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover{
            background-color: #3e7362;
        }
       a.hover{
            background-color: #928caa;
        }

    </style>
</head>
<body>
    <div class="container" id="cont1">
    <h3>Buttons</h3>
    <p>Buttons are clickable elements that allow users to perform actions or trigger events on a webpage. They can be styled in various ways to enhance the user experience.</p>
    <a href="https://www.google.com" class="btn">Google</a>
    <button class="btn" id="btn1">Contact us</button>
    </div>
</body>
</html>
